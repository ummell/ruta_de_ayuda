<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <!-- Yellow arc (top half) -->
  <path d="M 200 60 A 100 100 0 0 1 300 160 A 100 100 0 0 0 200 60" fill="#FCD34D"/>
  <path d="M 100 160 A 100 100 0 0 1 200 60 A 100 100 0 0 0 100 160" fill="#FCD34D"/>

  <!-- Small red heart at the top center -->
  <path d="M 200 100
           C 195 90, 180 90, 180 105
           C 180 120, 200 135, 200 135
           C 200 135, 220 120, 220 105
           C 220 90, 205 90, 200 100 Z"
        fill="#DC2626"/>

  <!-- Pin shape (split in half) -->
  <!-- Left half (blue) -->
  <path d="M 200 160
           C 140 160, 100 200, 100 260
           C 100 320, 200 430, 200 430
           L 200 160 Z"
        fill="#1E40AF"/>

  <!-- Right half (red) -->
  <path d="M 200 160
           C 260 160, 300 200, 300 260
           C 300 320, 200 430, 200 430
           L 200 160 Z"
        fill="#DC2626"/>

  <!-- Text: "ruta de" (blue) -->
  <text x="50%" y="475"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="900"
        font-size="64"
        text-anchor="middle"
        fill="#1E40AF">ruta de ayuda</text>
</svg>
